        preferences.
    - title: Scaling Laws for Neural Language Models
      year: 2020
      era: foundational
      arxiv: '2001.08361'
      subarea: scaling
      significance: Quantified power-law loss scaling in model size, data, and compute, guiding how to allocate
        compute for LLM training.
    - title: Language Models are Few-Shot Learners
      year: 2020
      era: foundational
      arxiv: '2005.14165'
      subarea: scaling
      significance: GPT-3 (175B) showed emergent few-shot in-context learning, popularizing prompting over
        fine-tuning as scale unlocks abilities.
    - title: Learning to Summarize from Human Feedback
      year: 2020
      era: foundational
