  rl:
    topic_group: rl
    display_name: Reinforcement Learning
    path_order: 3
    emergence_year: 2013
    description: 'Deep reinforcement learning: value-based and policy-gradient methods, self-play and game
      milestones, world models, exploration, offline RL, sequence-model RL, and preference/verifiable-reward
      RL feeding modern LLM training.'
    seeds:
    - title: Playing Atari with Deep Reinforcement Learning
      year: 2013
      era: emergence
      arxiv: '1312.5602'
      subarea: value_based
      significance: 'DQN: first agent to learn many Atari games at human level via CNN Q-learning from raw
        pixels (Nature 2015 follow-up).'
    - title: Deterministic Policy Gradient Algorithms
      year: 2014
      era: emergence
      subarea: policy_gradient
      significance: Theoretical groundwork for deterministic actor-critic in continuous action spaces; direct
        precursor to DDPG.
    - title: Trust Region Policy Optimization
      year: 2015
      era: emergence
      arxiv: '1502.05477'
      subarea: policy_gradient
      significance: Stabilized on-policy policy gradients with a KL trust-region constraint, preventing catastrophic
        policy drops.
    - title: High-Dimensional Continuous Control Using Generalized Advantage Estimation
      year: 2015
      era: emergence
      arxiv: '1506.02438'
      subarea: policy_gradient
      significance: 'GAE: variance-reduced advantage estimates trading bias against variance; stabilized TRPO
        and later PPO training.'
    - title: Continuous control with deep reinforcement learning
      year: 2015
      era: emergence
      arxiv: '1509.02971'
      subarea: policy_gradient
      significance: DDPG extended DPG with replay and target networks; breakthrough for high-dimensional continuous
        control.
    - title: Deep Reinforcement Learning with Double Q-learning
      year: 2015
      era: emergence
      arxiv: '1509.06461'
      subarea: value_based
      significance: Decoupled action selection from evaluation to fix DQN overestimation bias; made deep Q-learning
        reliable.
    - title: Prioritized Experience Replay
      year: 2015
      era: emergence
      arxiv: '1511.05952'
      subarea: value_based
      significance: Replays high-TD-error transitions more often, accelerating error correction and improving
        sample efficiency.
    - title: Dueling Network Architectures for Deep Reinforcement Learning
      year: 2015
      era: emergence
      arxiv: '1511.06581'
      subarea: value_based
      significance: Split the Q-network into state-value and advantage streams, improving performance across
        Atari.
    - title: Mastering the game of Go with deep neural networks and tree search
      year: 2016
      era: foundational
      doi: 10.1038/nature16961
      subarea: games
      significance: 'AlphaGo: historic first AI to defeat a world Go champion, combining deep policy/value
        networks with MCTS.'
    - title: Asynchronous Methods for Deep Reinforcement Learning
      year: 2016
      era: foundational
      arxiv: '1602.01783'
      subarea: policy_gradient
      significance: A3C used parallel asynchronous actors to decorrelate data without a replay buffer, dramatically
        boosting learning speed.
    - title: Deep Reinforcement Learning from Human Preferences
      year: 2017
      era: foundational
      arxiv: '1706.03741'
      subarea: rlhf
      significance: Introduced RLHF - a reward model learned from human preference comparisons replaces hand-crafted
        rewards.
    - title: Proximal Policy Optimization Algorithms
      year: 2017
      era: foundational
      arxiv: '1707.06347'
      subarea: policy_gradient
      significance: Clipped surrogate objective made trust-region-style updates simple and reliable; the most
        popular deep-RL algorithm.
    - title: A Distributional Perspective on Reinforcement Learning
      year: 2017
      era: foundational
      arxiv: '1707.06887'
      subarea: value_based
      significance: C51 learned full return distributions instead of expected values; influenced Rainbow and
        many successors.
    - title: 'Rainbow: Combining Improvements in Deep Reinforcement Learning'
      year: 2017
      era: foundational
      arxiv: '1710.02298'
      subarea: value_based
      significance: Combined six DQN enhancements into one SOTA Atari agent, showing the extensions are largely
        complementary.
    - title: Mastering the game of Go without human knowledge
      year: 2017
      era: foundational
      subarea: games
      significance: AlphaGo Zero learned Go from scratch through pure self-play RL plus MCTS, surpassing AlphaGo
        without human games.
    - title: Mastering Chess and Shogi by Self-Play with a General Reinforcement Learning Algorithm
      year: 2017
      era: foundational
      arxiv: '1712.01815'
      subarea: games
      significance: AlphaZero generalized self-play plus search to master chess, shogi, and Go with one algorithm
        (Science 2018).
    - title: 'Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic
        Actor'
      year: 2018
      era: foundational
      arxiv: '1801.01290'
      subarea: policy_gradient
      significance: Maximum-entropy off-policy actor-critic with twin critics; SOTA stability and sample efficiency
        in continuous control.
    - title: 'IMPALA: Scalable Distributed Deep-RL with Importance Weighted Actor-Learner Architectures'
      year: 2018
      era: foundational
      arxiv: '1802.01561'
      subarea: policy_gradient
      significance: V-trace off-policy correction let a central learner scale to many distributed actors;
        shaped large-scale RL systems.
    - title: Addressing Function Approximation Error in Actor-Critic Methods
      year: 2018
      era: foundational
      arxiv: '1802.09477'
      subarea: policy_gradient
      significance: TD3 fixed DDPG overestimation via twin Q-networks, delayed policy updates, and target
        smoothing.
    - title: World Models
      year: 2018
      era: foundational
      arxiv: '1803.10122'
      subarea: model_based
      significance: Learned a compact latent model of the environment and trained the policy inside the dream;
        inspired PlaNet and Dreamer.
    - title: Learning Latent Dynamics for Planning from Pixels
      year: 2018
      era: foundational
      arxiv: '1811.04551'
      subarea: model_based
      significance: PlaNet learned latent-space dynamics from images to plan without a known model, enabling
        strong control from pixels.
    - title: Grandmaster level in StarCraft II using multi-agent reinforcement learning
      year: 2019
      era: expansion
      subarea: games
      significance: AlphaStar reached Grandmaster level in StarCraft II via a multi-agent self-play league,
        defeating professionals.
    - title: Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model
      year: 2019
      era: expansion
      arxiv: '1911.08265'
      subarea: model_based
      significance: MuZero planned with a learned dynamics model without given rules; superhuman in board
        games plus SOTA Atari.
    - title: 'Dream to Control: Learning Behaviors by Latent Imagination'
      year: 2019
      era: expansion
      arxiv: '1912.01603'
      subarea: model_based
      significance: Dreamer trained an actor-critic inside a learned latent world model by imagination; big
        sample-efficiency gains from pixels.
    - title: Dota 2 with Large Scale Deep Reinforcement Learning
      year: 2019
      era: expansion
      arxiv: '1912.06680'
      subarea: games
      significance: OpenAI Five used massively scaled PPO self-play to defeat the Dota 2 world champions in
        5v5.
    - title: 'Agent57: Outperforming the Atari Human Benchmark'
      year: 2020
      era: expansion
      arxiv: '2003.13350'
      subarea: exploration
      significance: First deep-RL agent above the human baseline on all 57 Atari games, pairing NGU exploration
        with a meta-controller.
    - title: Conservative Q-Learning for Offline Reinforcement Learning
      year: 2020
      era: expansion
      arxiv: '2006.04779'
      subarea: offline_rl
      significance: CQL regularizes Q-values to stay conservative on out-of-distribution actions; the anchor
        algorithm of offline RL.
    - title: Mastering Atari with Discrete World Models
      year: 2020
      era: expansion
      arxiv: '2010.02193'
      subarea: model_based
      significance: 'DreamerV2: first model-based agent to reach human-level Atari, matching top model-free
        methods with equal experience.'
    - title: First return, then explore
      year: 2021
      era: expansion
      doi: 10.1038/s41586-020-03157-9
      subarea: exploration
      significance: Go-Explore's remember-and-return strategy solved previously unsolved hard-exploration
        games like Montezuma's Revenge.
    - title: 'Decision Transformer: Reinforcement Learning via Sequence Modeling'
      year: 2021
      era: expansion
      arxiv: '2106.01345'
      subarea: sequence_rl
      significance: Recast RL as return-conditioned sequence modeling with Transformers, matching SOTA offline
        RL without value functions.
    - title: Open-Ended Learning Leads to Generally Capable Agents
      year: 2021
      era: expansion
      arxiv: '2107.12808'
      subarea: games
      significance: 'XLand: open-ended training across 700k+ tasks produced generally capable agents that
        generalize to unseen games.'
    - title: A Generalist Agent
      year: 2022
      era: expansion
      arxiv: '2205.06175'
      subarea: sequence_rl
      significance: 'Gato: a single transformer policy performing 600+ tasks across games, vision, language,
        and robotics.'
    - title: Discovering faster matrix multiplication algorithms with reinforcement learning
      year: 2022
      era: expansion
      doi: 10.1038/s41586-022-05172-4
      subarea: games
      significance: AlphaTensor's AlphaZero-style search found matrix-multiplication algorithms beating a
        50-year-old record.
    - title: Human-level play in the game of Diplomacy by combining language models with strategic reasoning
      year: 2022
      era: expansion
      doi: 10.1126/science.ade9097
      subarea: games
      significance: 'CICERO: first AI with human-level Diplomacy play - a language model plus RL planning;
        top 10% of human players.'
    - title: Mastering Diverse Domains through World Models
      year: 2023
      era: recent
      arxiv: '2301.04104'
      subarea: model_based
      significance: DreamerV3 mastered 150+ diverse tasks with one configuration; first agent to collect Minecraft
        diamonds from scratch.
    - title: Faster sorting algorithms discovered using deep reinforcement learning
      year: 2023
      era: recent
      subarea: games
      significance: AlphaDev discovered faster sorting routines; first RL-invented algorithms merged into
        the LLVM libc++ standard library.
    - title: 'DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models'
      year: 2024
      era: recent
      arxiv: '2402.03300'
      subarea: rlhf
      significance: Introduced GRPO, the critic-free PPO variant that became the de facto algorithm for RL
        with verifiable rewards on LLMs.
