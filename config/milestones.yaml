    description: 'Large language models: the Transformer lineage through pretraining, scaling laws, alignment
      (RLHF and successors), open-weight releases, efficiency, and reasoning models.'
    seeds:
    - title: Attention Is All You Need
      year: 2017
      era: emergence
      arxiv: '1706.03762'
      subarea: architecture
      significance: Introduced the Transformer, replacing recurrence with self-attention; the foundational
        architecture of virtually all LLMs.
    - title: Improving Language Understanding by Generative Pre-Training
      year: 2018
      era: emergence
      subarea: pretraining
      significance: GPT-1 established the pretrain-then-finetune paradigm; one Transformer pretrained on unlabeled
        text beat task-specific models.
    - title: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
      year: 2018
      era: emergence
      arxiv: '1810.04805'
      subarea: pretraining
      significance: Masked language modeling for bidirectional context; the ubiquitous pretrained encoder
        baseline across NLU tasks.
    - title: Language Models are Unsupervised Multitask Learners
      year: 2019
      era: emergence
      subarea: scaling
      significance: GPT-2 (1.5B) showed scaling model and data yields zero-shot abilities - coherent text,
        QA, translation with no task training.
    - title: Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer
      year: 2019
      era: emergence
      arxiv: '1910.10683'
