canonical_key: arxiv-2602.00575
version_key: v1
title: 'Agentic Reward Modeling: Verifying GUI Agent via Progressive Trajectory-Grounded Interaction'
authors:
- Chaoqun Cui
- Jing Huang
- Shijing Wang
- Liming Zheng
- Qingchao Kong
- Zhixiong Zeng
abstract: Reinforcement learning with verifiable rewards (RLVR) provides a promising pathway for continuously
  advancing GUI agents, yet existing reward modeling paradigms face complementary limitations. Rule-based
  methods suffer from poor scalability and cannot handle open-ended tasks. LLM-as-a-Judge methods enable
  scalable trajectory verification but remain passive and are constrained by partial state observability,
  since key evidence often resides in latent environment states beyond the trajectory. Recent active environment
  interaction methods mitigate observability issues but tend to over-rely on probing while under-utilizing
  direct trajectory evidence, leading to verification inefficiency. To address these challenges, we advocate
  a trajectory-grounded interactive verification paradigm. We introduce VAGEN, a framework that employs
  a tool-augmented verifier agent governed by a Progressive Verification Mechanism, which follows a surface-to-latent
  and cheap-to-expensive design philosophy to extract trajectory evidence and probe environment states
  in a proactive end-to-end manner. Experiments on OSWorld-Verified and AndroidWorld benchmarks demonstrate
  that VAGEN significantly improves evaluation accuracy with a favorable performance-efficiency trade-off.
