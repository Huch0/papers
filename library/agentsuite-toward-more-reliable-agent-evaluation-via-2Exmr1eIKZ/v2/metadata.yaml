abstract: Reliable evaluation of large language model (LLM) agents depends critically on benchmark validity,
  yet modern agent benchmarks often contain hidden flaws arising from interactions among user instructions,
  environments, tools, ground-truth trajectories, and evaluation protocols. These flaws confound model
  errors with benchmark artifacts and undermine leaderboard-based comparisons. We propose COBA (COmponent-based
  Benchmark Auditing), an automated pipeline for diagnosing and filtering validity issues in agent benchmarks.
  COBA decomposes agent tasks into four standardized components—User, Environment, Ground Truth, and Evaluation—and
  operationalizes a component-level issue taxonomy using hybrid rule-based detectors and taxonomy-guided
  LLM evaluation. Across six widely used agent benchmarks, COBA achieves strong alignment with expert
  judgments, with F1 scores between 0.791 and 0.874. It complements manual verification of tau^2-bench
  by identifying issues missed due to benchmark complexity, and generalizes to previously unseen benchmarks
  with minimal adaptation. Our analysis shows that benchmark flaws are widespread and materially affect
  evaluation outcomes, demonstrating that component-based auditing provides a scalable foundation for
  more reliable and interpretable agent evaluation. We release AgentSuite, a unified benchmark-running
  platform that includes the COBA auditing pipeline and audited benchmark variants.
