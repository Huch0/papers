title: Applying Cognitive Design Patterns to General LLM Agents
authors:
- Robert E. Wray
- James R. Kirk
- John E. Laird
abstract: One goal of AI (and AGI) is to identify and understand specific mechanisms and representations
  sufficient for general intelligence. Often, this work manifests in research focused on architectures
  and many cognitive architectures have been explored in AI/AGI. However, different research groups and
  even different research traditions have somewhat independently identified similar/common patterns of
  processes and representations or "cognitive design patterns" that are manifest in existing architectures.
  Today, AI systems exploiting large language models (LLMs) offer a relatively new combination of mechanisms
  and representations available for exploring the possibilities of general intelligence. This paper outlines
  a few recurring cognitive design patterns that have appeared in various pre-transformer AI architectures.
  We then explore how these patterns are evident in systems using LLMs, especially for reasoning and interactive
  ("agentic") use cases. Examining and applying these recurring patterns enables predictions of gaps or
  deficiencies in today's Agentic LLM Systems and identification of subjects of future research towards
  general intelligence using generative foundation models.
