abstract: We introduce a new benchmark, ChartMimic, aimed at assessing the visually-grounded code generation
  capabilities of large multimodal models (LMMs). ChartMimic utilizes information-intensive visual charts
  and textual instructions as inputs, requiring LMMs to generate the corresponding code for chart rendering.
  ChartMimic includes 4,800 human-curated (figure, instruction, code) triplets, which represent the authentic
  chart use cases found in scientific papers across various domains (e.g., Physics, Computer Science,
  Economics, etc). These charts span 18 regular types and 4 advanced types, diversifying into 201 subcategories.
  Furthermore, we propose multi-level evaluation metrics to provide an automatic and thorough assessment
  of the output code and the rendered charts. Unlike existing code generation benchmarks, ChartMimic places
  emphasis on evaluating LMMs' capacity to harmonize a blend of cognitive capabilities, encompassing visual
  understanding, code generation, and cross-modal reasoning. The evaluation of $3$ proprietary models
  and 14 open-weight models highlights the substantial challenges posed by ChartMimic. Even the advanced
  GPT-4o, InternVL2-Llama3-76B only achieved an average score across Direct Mimic and Customized Mimic
  tasks of 82.2 and 61.6, respectively, indicating significant room for improvement. We anticipate that
  ChartMimic will inspire the development of LMMs, advancing the pursuit of artificial general intelligence.
