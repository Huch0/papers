title: Differential Testing for Software.
authors:
- W. M. McKeeman
abstract: Differential testing, a form of random testing, is a component of a mature testing technology
  for large software systems. It complements regression testing based on commercial test suites and tests
  locally developed during product development and deployment. Differential testing requires that two
  or more comparable systems be available to the tester. These systems are presented with an exhaustive
  series of mechanically generated test cases. If (we might say when) the results differ or one of the
  systems loops indefinitely or crashes, the tester has a candidate for a bug-exposing test. Implementing
  differential testing is an interesting technical problem. Getting it into use is an even more interesting
  social challenge. This paper is derived from experience in differential testing of compilers and run-time
  systems at DIGITAL over the last few years and recently at Compaq. A working prototype for testing C
  compilers is available on the web.
