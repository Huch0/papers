title: Finetuned Language Models Are Zero-Shot Learners
authors:
- Jason Wei
- Maarten Bosma
- Vincent Y. Zhao
- Kelvin Guu
- Adams Wei Yu
- Brian Lester
- Nan Du
- Andrew M. Dai
