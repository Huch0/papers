version_key: v1
title: How Far Ahead Do LLMs Plan? Uncovering the Latent Horizon in Chain-of-Thought Reasoning
authors:
- Liyan Xu
- Mo Yu
- Fandong Meng
- Jie Zhou
abstract: 'Chain-of-thought (CoT) reasoning has become a central mechanism for eliciting multi-step reasoning
  in Large Language Models (LLMs). Yet recent evidence presents a tension: hidden states appear to already
  encode future reasoning before CoT fully unfolds, while explicit steps still remain crucial for tasks
  requiring compositional computation. To deepen the understanding between LLM''s internal states and
  its verbalized reasoning trajectories, we investigate the latent planning strength of LLMs, through
  our probing method, Tele-Lens, applying to hidden states across diverse task domains. Our empirical
  results indicate that LLMs exhibit a myopic horizon, primarily conducting incremental transitions without
  precise global planning. Leveraging this characteristic, we propose a hypothesis on enhancing uncertainty
  estimation of CoT, which we validate that a sparse set of pivot positions can effectively represent
  the uncertainty of the entire path. We further underscore the significance of exploiting CoT dynamics,
  and demonstrate that automatic recognition of CoT bypass can be achieved without performance degradation.
  Our code, data and models are released at https://github.com/lxucs/tele-lens.'
