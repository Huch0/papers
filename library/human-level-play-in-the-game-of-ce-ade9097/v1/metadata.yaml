abstract: Despite much progress in training artificial intelligence (AI) systems to imitate human language,
  building agents that use language to communicate intentionally with humans in interactive environments
  remains a major challenge. We introduce Cicero, the first AI agent to achieve human-level performance
  in Diplomacy , a strategy game involving both cooperation and competition that emphasizes natural language
  negotiation and tactical coordination between seven players. Cicero integrates a language model with
  planning and reinforcement learning algorithms by inferring players’ beliefs and intentions from its
  conversations and generating dialogue in pursuit of its plans. Across 40 games of an anonymous online
  Diplomacy league, Cicero achieved more than double the average score of the human players and ranked
  in the top 10% of participants who played more than one game.
