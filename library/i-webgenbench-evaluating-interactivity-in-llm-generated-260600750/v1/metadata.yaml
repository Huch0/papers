version_key: v1
title: 'I-WebGenBench : Evaluating Interactivity in LLM-Generated Scientific Web Applications'
authors:
- Dasen Dai
- Biao Wu
- Meng Fang
- Shuoqi Li
- Wenhao Wang
abstract: Recent advances in visual language models have enabled autonomous agents for complex reasoning,
  tool use, and document understanding. However, existing document agents mainly transform papers into
  static artifacts such as summaries, webpages, or slides, which are insufficient for technical papers
  involving dynamic mechanisms and state transitions. In this work, we propose a Paper-to-Interactive-System
  Agent that converts research papers into executable interactive web systems. Given a PDF paper, the
  agent performs end-to-end processing without human intervention, including paper understanding, system
  modeling, and interactive webpage synthesis, enabling users to manipulate inputs and observe dynamic
  behaviors. To evaluate this task, we introduce a benchmark of 19 research papers paired with expert-built
  interactive systems as ground truth. We further propose PaperVoyager, a structured generation framework
  that explicitly models mechanisms and interaction logic during synthesis. Experiments show that PaperVoyager
  significantly improves the quality of generated interactive systems, offering a new paradigm for interactive
  scientific paper understanding.
