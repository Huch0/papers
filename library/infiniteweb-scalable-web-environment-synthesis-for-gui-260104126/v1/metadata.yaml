canonical_key: arxiv-2601.04126
version_key: v1
title: 'InfiniteWeb: Scalable Web Environment Synthesis for GUI Agent Training'
authors:
- Ziyun Zhang
- Zezhou Wang
- Xiaoyi Zhang
- Zongyu Guo
- Jiahao Li
- Bin Li
- Yan Lu
abstract: GUI agents that interact with graphical interfaces on behalf of users represent a promising
  direction for practical AI assistants. However, training such agents is hindered by the scarcity of
  suitable environments. We present InfiniteWeb, a system that automatically generates functional web
  environments at scale for GUI agent training. While LLMs perform well on generating a single webpage,
  building a realistic and functional website with many interconnected pages faces challenges. We address
  these challenges through unified specification, task-centric test-driven development, and a combination
  of website seed with reference design image to ensure diversity. Our system also generates verifiable
  task evaluators enabling dense reward signals for reinforcement learning. Experiments show that InfiniteWeb
  surpasses commercial coding agents at realistic website construction, and GUI agents trained on our
  generated environments achieve significant performance improvements on OSWorld and Online-Mind2Web,
  demonstrating the effectiveness of proposed system.
