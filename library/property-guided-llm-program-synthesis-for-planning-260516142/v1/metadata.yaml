title: Property-Guided LLM Program Synthesis for Planning
authors:
- André G. Pereira
- Augusto B. Corrêa
- Jendrik Seipp
abstract: 'LLMs have shown impressive success in program synthesis, discovering programs that surpass
  prior solutions. However, these approaches rely on simple numeric scores to signal program quality,
  such as the value of the solution or the number of passed tests. Because a score offers no guidance
  on why a program failed, the system must generate and evaluate many candidates hoping some succeed,
  increasing LLM inference and evaluation costs. We study a different approach: property-guided LLM program
  synthesis. Instead of scoring programs after evaluation, we check whether a candidate satisfies a formally
  defined property. When the property is violated, we stop the evaluation early and provide the LLM with
  a concrete counterexample showing exactly how the program failed. This feedback drastically reduces
  both the number of program generations and the evaluation cost, and can guide the LLM to generate stronger
  programs. We evaluate this approach on PDDL planning domains, asking the LLM to synthesize direct heuristic
  functions: every state reachable by strictly improving transitions has a strictly improving successor.
  A heuristic with this property leads hill-climbing algorithm directly to a goal state. A counterexample-guided
  repair loop generates one candidate program, checks the property over a training set, and returns the
  first case that violates the property. We evaluate our approach on ten planning domains with an out-of-distribution
  test set. The synthesized heuristics are effectively direct on virtually all test tasks, and compared
  to the best prior generation method our approach generates seven times fewer programs per domain on
  average, solves more tasks without using search, and requires several orders of magnitude less computation
  to evaluate candidates. Whenever a problem admits a verifiable property, property-guided LLM synthesis
  can reduce cost and improve program quality.'
